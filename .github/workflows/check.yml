name: Check toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/editing.py validate examples/timeline.json
      - run: python3 tools/check_repo.py
      - run: python3 tools/manage_skills.py sync --check
      - run: npm ci
        working-directory: studio
      - run: npm run lint
        working-directory: studio
      - run: npm run build
        working-directory: studio
