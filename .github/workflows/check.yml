name: Check toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: python3 -m pip install -r requirements-analysis.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/editing.py validate examples/timeline.json
      - run: python3 tools/editing.py validate examples/timeline-source.json
      - run: python3 tools/editing.py cut-list examples/timeline-source.json "${{ runner.temp }}/cut-list.csv"
      - run: python3 tools/check_repo.py
      - run: python3 tools/manage_skills.py sync --check
      - run: npm ci
        working-directory: studio
      - run: npm run lint
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - run: python3 tools/demo_project.py "${{ runner.temp }}/demo"
      - run: python3 tools/analyze_media.py "${{ runner.temp }}/demo/media" "${{ runner.temp }}/demo/review"
      - run: python3 tools/beat_candidates.py "${{ runner.temp }}/demo/media/original-rhythm.wav" "${{ runner.temp }}/demo/beat-candidates.json" --source-in 0.5
      - run: python3 tools/film.py render "${{ runner.temp }}/demo/timeline.json" "${{ runner.temp }}/demo/preview.mp4" --media-root "${{ runner.temp }}/demo" --scale 0.25 --gl swangle
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-pipeline-preview
          path: |
            ${{ runner.temp }}/demo/preview.mp4
            ${{ runner.temp }}/demo/preview.qa.json
            ${{ runner.temp }}/demo/review/contact-*.jpg
          retention-days: 7
